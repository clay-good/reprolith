[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprolith"
version = "0.0.1"
description = "Auto-reproduction & certification engine for the computational biomedical modeling literature."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Clay Good" }]
keywords = [
    "reproducibility",
    "biomedical-modeling",
    "pharmacometrics",
    "PK/PD",
    "systems-biology",
    "SBML",
    "SED-ML",
    "certification",
    "verification",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# The engine skeleton is intentionally dependency-free: the honesty invariants
# (determinism, inescapable scope, assumption-qualification) rest on the standard
# library alone, so the required-checks gate stays fast and trivially reproducible.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/clay-good/reprolith"
Repository = "https://github.com/clay-good/reprolith"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
reprolith = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python/reprolith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
