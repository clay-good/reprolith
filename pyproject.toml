[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprolith"
version = "0.0.1"
description = "Auto-reproduction & certification engine for the computational biomedical modeling literature."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Clay Good" }]
keywords = [
    "reproducibility",
    "biomedical-modeling",
    "pharmacometrics",
    "PK/PD",
    "systems-biology",
    "SBML",
    "SED-ML",
    "certification",
    "verification",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# The engine skeleton is intentionally dependency-free: the honesty invariants
# (determinism, inescapable scope, assumption-qualification) rest on the standard
# library alone, so the required-checks gate stays fast and trivially reproducible.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]
# The SBML tooling and pinned registered simulation engine (bootstrap tasks 0.1, 3.1).
# Optional on purpose: the core stays dependency-free and the required-checks gate does not
# need it. Install with `pip install -e ".[engine]"` to build SBML from a dossier and run
# the simulation-backed tests and reconstructions.
# 4.47.309 is excluded because it is broken for this use and its author yanked it ("Incompatibity
# with 4.46"): every simulation raises `TypeError: CCopasiTask_initialize, argument 2 of type
# 'int'`, and the process aborts on `std::bad_alloc` under load. A yank is not always enough — CI
# resolved it anyway on one interpreter after the yank — so it is named here.
engine = ["python-copasi>=4.42,!=4.47.309", "python-libsbml>=5.20"]
# The constraint-based (FBA) oracle's linear-programming solver. Optional, like the engine.
fba = ["scipy>=1.7", "numpy>=1.20"]  # numpy is imported directly, not only through scipy
# The scalable fixed-point solver for the logical class: a SAT solver (z3) that finds a large
# Boolean network's steady states without enumerating its 2ⁿ state space, so real 60–80-node
# signalling models are tractable. Optional — small networks use exact enumeration and need none.
sat = ["z3-solver>=4.12"]
# Independent implementations of the two formats Reprolith *writes*, used to check its output
# rather than its input. A writer validated only by its own reader is not validated: the exported
# document declared SED-ML L1V3 over a `numberOfSteps` attribute that arrives in L1V4, which
# round-tripped perfectly through this repository's own parser and fails schema validation
# everywhere else. libSEDML caught it. libCombine covers the layer above — the archive's manifest,
# which nothing but `ingest_omex` had ever read back. Optional, and needed only by the export
# tests' validation checks.
validate = ["python-libsedml>=2.0", "python-libcombine>=0.2"]
# A second registered engine (libRoadRunner) for cross-engine corroboration — run a curve under
# both COPASI and libRoadRunner and report whether the verdict is engine-independent. Optional.
# The second registered engine for each class that has one: libRoadRunner for the two ODE
# classes (a different integrator on the same SBML), COBRApy for the constraint-based class
# (a different reader and a different LP backend, compared on the objective value — the one
# quantity two correct solvers must agree on when the optimal flux vector is not unique).
corroborate = ["libroadrunner>=2.5", "cobra>=0.29", "cana>=1.0", "sympy>=1.12"]
# CANA enumerates the small Boolean networks' attractors and sympy's DPLL the large ones'
# fixed points — the question those certificates rest on, and one no 2ⁿ enumeration can
# answer. sympy is independent of the z3 Reprolith solves them with.
# Independent reference generators for the cross-validation ground truth (a dev-only task, run by
# scripts/regenerate_*_references.py). COBRApy re-computes the FBA references, libRoadRunner the
# kinetic curves, and CANA the logical (Boolean-network) attractors; the tests themselves need none
# of them — they read the committed reference data. Not a runtime dependency of Reprolith.
refgen = ["cobra>=0.29", "libroadrunner>=2.5", "cana>=1.0", "sympy>=1.12"]

[project.scripts]
# The human-facing CLI over the same read-only query surface — browse the catalog, read a
# certificate, list its gaps — from a terminal. Run `reprolith --help` after installing.
reprolith = "reprolith.cli:main"
# The agent-facing MCP server over the read-only query surface (JSON-RPC over stdio,
# dependency-free). Run `reprolith-mcp` after installing.
reprolith-mcp = "reprolith.mcp_server:main"

[project.urls]
Homepage = "https://github.com/clay-good/reprolith"
Repository = "https://github.com/clay-good/reprolith"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
reprolith = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python/reprolith"]

# The pinned engine and SBML tooling (python-copasi, python-libsbml) are optional
# dependencies with no type stubs, touched only behind lazy imports in reprolith.engine
# and reprolith.sbml.
[[tool.mypy.overrides]]
module = "COPASI"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "libsbml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "roadrunner"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "z3"
ignore_missing_imports = true

# The second implementations each corroborated class is compared against, all behind lazy imports
# in reprolith.corroboration.
# Each is listed with and without the submodule glob: a bare `import cobra` is not matched by
# `cobra.*`, which is how three of these went on failing after the override was added.
[[tool.mypy.overrides]]
module = ["cobra", "cobra.*", "cana", "cana.*", "sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
