name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# These are the gates the github-collaboration spec requires on every change —
# human PRs and the autonomous build loop meet the identical bar.
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

  # The dependency-free core gate (job `python`) never installs the optional extras, so the
  # extra-backed tests (real simulation, ingestion, the linter, the FBA oracle, the scalable
  # logical SAT solver) skip there. This job installs the engine, fba, sat, and validate extras and
  # runs them, so those paths have CI coverage. `validate` is libSEDML and libCombine, independent
  # implementations that read what Reprolith *writes* rather than what it reads: the check that
  # caught the exported document declaring the wrong SED-ML level was local-only, so the guard that
  # found that defect was not running anywhere it could catch the next one.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the engine, fba, sat, and validate extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engine,fba,sat,validate]"
      - name: Tests (pytest, extra-backed included)
        run: pytest -q

  # Cross-engine corroboration needs a *second* registered engine (libRoadRunner) alongside COPASI,
  # and no other job installs it — so its tests skipped everywhere and what CI actually checked was
  # that a committed JSON file said `true`. This job runs them. One interpreter: the point is that
  # two independent engines agree on a trajectory, which does not vary by Python version, and
  # libRoadRunner ships wheels for fewer versions than the rest of the matrix.
  corroborate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the engine, fba, sat and corroborate extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engine,fba,sat,corroborate]"
      # `fba` and `sat` are here because two of these comparisons have Reprolith's own solver on
      # the other side — the LP for the constraint-based class, z3 for the large logical networks'
      # fixed points. Without them the comparison has only one side and its tests skip, which is
      # the state this job exists to prevent.
      - name: Tests (cross-engine corroboration)
        run: |
          pytest -q tests/test_corroboration.py tests/test_fba_corroboration.py \
            tests/test_logical_corroboration.py tests/test_stochastic_corroboration.py

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned, not `@latest`. This gate went red on a commit that touched no spec, because
      # `@latest`'s dependency tree briefly resolved to a version of `@inquirer/ansi` npm could
      # not find — a gate whose verdict depends on what the registry serves that minute reports
      # the registry, not this repository. Raise the pin deliberately, the way every other
      # version here moves.
      - name: Validate specs and changes (OpenSpec, strict)
        run: |
          npx --yes @fission-ai/openspec@1.11.0 validate --specs --strict
          npx --yes @fission-ai/openspec@1.11.0 validate --changes --strict
