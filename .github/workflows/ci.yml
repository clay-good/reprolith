name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# These are the gates the github-collaboration spec requires on every change —
# human PRs and the autonomous build loop meet the identical bar.
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

  # The dependency-free core gate (job `python`) never installs the optional extras, so the
  # extra-backed tests (real simulation, ingestion, the linter, the FBA oracle, the scalable
  # logical SAT solver) skip there. This job installs the engine, fba, sat, and validate extras and
  # runs them, so those paths have CI coverage. `validate` is libSEDML and libCombine, independent
  # implementations that read what Reprolith *writes* rather than what it reads: the check that
  # caught the exported document declaring the wrong SED-ML level was local-only, so the guard that
  # found that defect was not running anywhere it could catch the next one.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the engine, fba, sat, and validate extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engine,fba,sat,validate]"
      - name: Tests (pytest, extra-backed included)
        run: pytest -q

  # Cross-engine corroboration needs a *second* registered engine (libRoadRunner) alongside COPASI,
  # and no other job installs it — so its tests skipped everywhere and what CI actually checked was
  # that a committed JSON file said `true`. This job runs them. One interpreter: the point is that
  # two independent engines agree on a trajectory, which does not vary by Python version, and
  # libRoadRunner ships wheels for fewer versions than the rest of the matrix.
  corroborate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the engine and corroborate extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engine,corroborate]"
      - name: Tests (cross-engine corroboration)
        run: pytest -q tests/test_corroboration.py

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate specs and changes (OpenSpec, strict)
        run: |
          npx --yes @fission-ai/openspec@latest validate --specs --strict
          npx --yes @fission-ai/openspec@latest validate --changes --strict
