name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# These are the gates the github-collaboration spec requires on every change —
# human PRs and the autonomous build loop meet the identical bar.
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

  # The dependency-free core gate (job `python`) never installs the optional extras, so the
  # extra-backed tests (real simulation, ingestion, the linter, the FBA oracle, the scalable
  # logical SAT solver) skip there. This job installs the engine, fba, and sat extras and runs
  # them, so those paths have CI coverage.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the engine, fba, and sat extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engine,fba,sat]"
      - name: Tests (pytest, extra-backed included)
        run: pytest -q

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate specs and changes (OpenSpec, strict)
        run: |
          npx --yes @fission-ai/openspec@latest validate --specs --strict
          npx --yes @fission-ai/openspec@latest validate --changes --strict
